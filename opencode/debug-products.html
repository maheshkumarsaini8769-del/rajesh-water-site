<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Debug Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      background: #f0f0f0;
    }
    .debug-box {
      background: white;
      padding: 20px;
      margin: 10px 0;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .success { color: green; }
    .error { color: red; }
    .warning { color: orange; }
    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>
  <h1>🔍 Product Debug Page</h1>

  <div class="debug-box">
    <h2>Test 1: Check if main.js loads</h2>
    <button onclick="checkMainJS()">Check main.js</button>
    <div id="mainJSResult"></div>
  </div>

  <div class="debug-box">
    <h2>Test 2: Check if products array exists</h2>
    <button onclick="checkProducts()">Check products</button>
    <div id="productsResult"></div>
  </div>

  <div class="debug-box">
    <h2>Test 3: Check if grid element exists</h2>
    <button onclick="checkGrid()">Check grid</button>
    <div id="gridResult"></div>
  </div>

  <div class="debug-box">
    <h2>Test 4: Render products directly</h2>
    <button onclick="renderProducts()">Render Products</button>
    <div id="renderResult"></div>
  </div>

  <script>
    function checkMainJS() {
      const result = document.getElementById('mainJSResult');
      result.innerHTML = '<p>Checking...</p>';

      setTimeout(() => {
        try {
          if (typeof products !== 'undefined') {
            result.innerHTML = '<p class="success">✅ Products array exists!</p>';
          } else {
            result.innerHTML = '<p class="error">❌ Products array NOT found!</p>';
          }
        } catch (e) {
          result.innerHTML = '<p class="error">❌ Error: ' + e.message + '</p>';
        }
      }, 500);
    }

    function checkProducts() {
      const result = document.getElementById('productsResult');

      try {
        if (typeof products !== 'undefined') {
          result.innerHTML = '<p class="success">✅ Products array found!</p>';
          result.innerHTML += '<p>Total products: ' + products.length + '</p>';
          result.innerHTML += '<ul>';
          products.slice(0, 5).forEach(p => {
            result.innerHTML += '<li>' + p.name + ' - ₹' + p.price + '</li>';
          });
          result.innerHTML += '</ul>';
        } else {
          result.innerHTML = '<p class="error">❌ Products array NOT found!</p>';
        }
      } catch (e) {
        result.innerHTML = '<p class="error">❌ Error: ' + e.message + '</p>';
      }
    }

    function checkGrid() {
      const result = document.getElementById('gridResult');

      try {
        const grid = document.getElementById('shopGrid');
        if (grid) {
          result.innerHTML = '<p class="success">✅ Grid element exists!</p>';
          result.innerHTML += '<p>Current HTML: ' + grid.innerHTML.substring(0, 100) + '...</p>';
        } else {
          result.innerHTML = '<p class="error">❌ Grid element NOT found!</p>';
        }
      } catch (e) {
        result.innerHTML = '<p class="error">❌ Error: ' + e.message + '</p>';
      }
    }

    function renderProducts() {
      const result = document.getElementById('renderResult');

      try {
        const grid = document.getElementById('shopGrid');
        if (!grid) {
          result.innerHTML = '<p class="error">❌ Grid element NOT found!</p>';
          return;
        }

        let html = '<ul style="list-style: none; padding: 0;">';
        products.slice(0, 10).forEach(p => {
          html += '<li style="background: #f9f9f9; padding: 10px; margin: 5px 0; border: 1px solid #ddd;">';
          html += '<strong>' + p.name + '</strong><br>';
          html += 'Price: ₹' + p.price + ' | ' + p.box + '<br>';
          html += '<img src="' + p.img + '" alt="' + p.name + '" style="max-width: 100px; height: auto;">';
          html += '</li>';
        });
        html += '</ul>';

        result.innerHTML = '<p class="success">✅ Products rendered successfully!</p>';
        result.innerHTML += html;

      } catch (e) {
        result.innerHTML = '<p class="error">❌ Error: ' + e.message + '</p>';
      }
    }
  </script>
</body>
</html>
