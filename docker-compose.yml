services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - backend/.env
    restart: unless-stopped
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/db-status"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  backend-data:
