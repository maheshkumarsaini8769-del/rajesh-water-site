<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajesh Water — Admin Panel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='10' fill='%2300aeef'/></svg>">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #05070D; --panel: #0D1421; --panel2: #111A29; --panel3: #151F31;
    --line: rgba(124,235,255,.12); --line2: rgba(124,235,255,.22);
    --text: #F4F8FC; --soft: #C2CCDA; --muted: #7E8CA0; --muted2: #5E6B7D;
    --acc: #38D9FF; --acc2: #0B5C7C; --accb: #7CEBFF;
    --accsoft: rgba(56,217,255,.12); --accglow: rgba(56,217,255,.22);
    --purple: #8B7CFF; --purple-soft: rgba(139,124,255,.12);
    --ok: #35E0A1; --oksoft: rgba(53,224,161,.12);
    --err: #FF5C7A; --errsoft: rgba(255,92,122,.12);
    --warn: #FFC857; --warnsoft: rgba(255,200,87,.12);
    --shadow: rgba(0,0,0,.45);
    --r-sm: 10px; --r-md: 16px; --r-lg: 22px;
    --ease: cubic-bezier(.22,1,.36,1);
  }
  html { color-scheme: dark; }
  ::selection { background: rgba(56,217,255,.22); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(124,235,255,.13); border-radius: 999px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }
  body {
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(56,217,255,.07), transparent 65%),
      radial-gradient(700px 450px at 10% 100%, rgba(139,124,255,.045), transparent 65%),
      #05070D;
    color: var(--text);
    font-family: "Inter Tight", "Inter", "Manrope", "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .wrap { display: flex; min-height: 100vh; }

  /* ===== Sidebar ===== */
  .side { width: 236px; flex-shrink: 0; background: #080D16; border-right: 1px solid rgba(124,235,255,.10); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
  .side-close { display: none; }
  .side .brand { padding: 18px 16px; border-bottom: 1px solid rgba(124,235,255,.10); display: flex; align-items: center; gap: 10px; }
  .side .brand .dot { width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #7CEBFF, #38D9FF 45%, #0B5C7C); box-shadow: 0 0 14px rgba(56,217,255,.45); flex-shrink: 0; }
  .side .brand b { font-size: 15px; letter-spacing: .04em; font-weight: 650; }
  .side .brand small { display: block; color: var(--muted); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; }
  .side nav { flex: 1; padding: 10px; overflow-y: auto; }
  .side nav button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; margin-bottom: 3px; background: transparent; border: 0; border-radius: 10px; color: var(--muted); font-size: 13.5px; cursor: pointer; text-align: left; position: relative; transition: background .25s var(--ease), color .25s ease; }
  .side nav button:hover { background: rgba(124,235,255,.06); color: var(--text); }
  .side nav button.on {
    background: rgba(56,217,255,.08);
    color: var(--accb);
    font-weight: 600;
    border: 1px solid rgba(56,217,255,.12);
    box-shadow: 0 0 18px rgba(56,217,255,.09);
  }
  .side nav button.on::before { content: ""; position: absolute; left: -1px; top: 24%; bottom: 24%; width: 2px; border-radius: 2px; background: linear-gradient(180deg, #7CEBFF, #38D9FF); box-shadow: 0 0 10px rgba(56,217,255,.7); }
  .side nav button .ic { width: 18px; text-align: center; }
  .side .group { padding: 16px 16px 5px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted2); font-weight: 700; }
  .side .foot { padding: 12px 16px; border-top: 1px solid rgba(124,235,255,.10); color: var(--muted); font-size: 11.5px; line-height: 1.6; }

  /* ===== Main ===== */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    display: flex; align-items: center; gap: 14px; padding: 11px 22px;
    background: rgba(5,7,13,.78);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(124,235,255,.08);
    position: sticky; top: 0; z-index: 20;
  }
  .topbar h1 { font-size: 15.5px; font-weight: 600; letter-spacing: -.01em; }
  .topbar-brand { display: none; }
  .topbar .spacer { flex: 1; }
  .topbar .open-site { text-decoration: none; color: var(--acc); font-weight: 600; padding: 7px 14px; border: 1px solid rgba(56,217,255,.35); border-radius: 999px; font-size: 12.5px; transition: background .25s ease, border-color .25s ease, box-shadow .25s ease; }
  .topbar .open-site:hover { background: rgba(56,217,255,.10); border-color: rgba(56,217,255,.6); box-shadow: 0 0 16px rgba(56,217,255,.12); }
  .lock-btn { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; background: rgba(17,26,41,.6); border: 1px solid rgba(124,235,255,.12); border-radius: 9px; color: var(--muted); font-size: 14px; cursor: pointer; flex-shrink: 0; transition: border-color .25s ease, color .25s ease; }
  .lock-btn:hover { border-color: rgba(255,92,122,.45); color: var(--err); }
  .btn { padding: 9px 18px; border: 0; border-radius: 10px; background: linear-gradient(135deg, #7CEBFF, #38D9FF); color: #041018; font-weight: 700; cursor: pointer; font-size: 13px; letter-spacing: .02em; box-shadow: 0 4px 16px rgba(56,217,255,.14); transition: transform .25s var(--ease), box-shadow .25s ease, filter .25s ease; font-variant-numeric: tabular-nums; }
  .btn:hover { transform: translateY(-1px); filter: brightness(1.06); box-shadow: 0 8px 26px rgba(56,217,255,.24); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: .45; cursor: not-allowed; filter: none; transform: none; box-shadow: none; }
  .btn.ghost { background: rgba(17,26,41,.55); border: 1px solid rgba(124,235,255,.14); color: var(--soft); box-shadow: none; }
  .btn.ghost:hover { color: var(--text); border-color: rgba(124,235,255,.32); }
  .btn.danger { background: linear-gradient(135deg, #FF5C7A, #8A2440); color: #fff; box-shadow: 0 4px 16px rgba(255,92,122,.14); }
  .btn.small { padding: 5px 11px; font-size: 12px; border-radius: 8px; }
  .content { padding: 22px; max-width: 1080px; width: 100%; }
  .card {
    background: linear-gradient(145deg, rgba(13,20,33,.96), rgba(9,14,24,.96));
    border: 1px solid rgba(124,235,255,.10);
    border-radius: 18px;
    padding: 18px 20px; margin-bottom: 18px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.035), 0 18px 50px rgba(0,0,0,.28);
  }
  .card h3 { font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--accb); margin-bottom: 14px; font-weight: 650; }
  .card .sub { color: var(--muted); font-size: 12px; margin: -8px 0 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; }
  .grid .full { grid-column: 1 / -1; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; letter-spacing: .03em; }
  .field label b { color: var(--err); }
  input[type=text], input[type=number], input[type=tel], input[type=password], input[type=url], input[type=date], textarea, select {
    width: 100%; background: #080D16; border: 1px solid rgba(124,235,255,.10); color: var(--text);
    border-radius: 10px; padding: 9px 12px; font-size: 13.5px; font-family: inherit;
    transition: border-color .25s ease, box-shadow .25s ease;
  }
  input::placeholder, textarea::placeholder { color: var(--muted2); }
  input:focus, textarea:focus, select:focus { outline: none; border-color: rgba(56,217,255,.45); box-shadow: 0 0 0 3px rgba(56,217,255,.07); }
  textarea { resize: vertical; min-height: 62px; }
  input[type=color] { width: 100%; height: 38px; border: 1px solid rgba(124,235,255,.10); border-radius: 10px; background: #080D16; padding: 3px; cursor: pointer; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--acc); }
  .hint { color: var(--muted); font-size: 11.5px; margin-top: 4px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .pill.ok { background: var(--oksoft); color: var(--ok); }
  .pill.warn { background: var(--warnsoft); color: var(--warn); }
  .pill.err { background: var(--errsoft); color: var(--err); }
/* ===== Products ===== */
  .ptable { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .ptable th { text-align: left; color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 8px 6px; border-bottom: 1px solid rgba(255,255,255,.06); }
  .ptable td { padding: 7px 6px; border-bottom: 1px solid rgba(255,255,255,.045); vertical-align: middle; }
  .ptable input { padding: 5px 8px; font-size: 12.5px; border-radius: 7px; }
  .ptable .thumb { width: 34px; height: 34px; border-radius: 8px; object-fit: contain; background: #fff; padding: 2px; }
  .mini { display: flex; gap: 4px; }
  .mini button { background: var(--panel2); border: 1px solid rgba(124,235,255,.12); color: var(--muted); width: 24px; height: 24px; border-radius: 7px; cursor: pointer; font-size: 12px; transition: color .2s ease, border-color .2s ease; }
  .mini button:hover { color: var(--text); border-color: var(--acc); }
  .mini button.rm:hover { color: var(--err); border-color: var(--err); }
  .feat-badge { width: 90px; }

  /* ===== Save bar ===== */
  .savebar { position: sticky; bottom: 0; margin-top: auto; display: flex; align-items: center; gap: 14px; padding: 12px 22px; background: rgba(5,7,13,.82); border-top: 1px solid rgba(124,235,255,.08); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
  .savebar .st { font-size: 12.5px; color: var(--muted); }
  .savebar .st.dirty { color: var(--warn); font-weight: 700; }

  /* ===== Toast ===== */
  #toast {
    position: fixed; right: 20px; bottom: 74px;
    background: rgba(17,26,41,.92);
    border: 1px solid rgba(124,235,255,.12); border-left: 4px solid var(--ok);
    border-radius: 12px; padding: 12px 18px; font-size: 13px; max-width: 340px;
    box-shadow: 0 14px 40px rgba(0,0,0,.5), 0 20px 60px rgba(0,0,0,.35);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    opacity: 0; transform: translateY(12px); transition: opacity .3s var(--ease), transform .3s var(--ease);
    pointer-events: none; z-index: 60;
    font-variant-numeric: tabular-nums;
  }
  #toast.show { opacity: 1; transform: none; }
  #toast.err { border-left-color: var(--err); }

  /* ===== Login ===== */
  #login {
    position: fixed; inset: 0;
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(56,217,255,.07), transparent 65%),
      radial-gradient(700px 450px at 10% 100%, rgba(139,124,255,.045), transparent 65%),
      var(--bg);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  #login .box {
    width: 330px; background: rgba(13,20,33,.92);
    border: 1px solid rgba(124,235,255,.13); border-radius: 18px; padding: 28px; text-align: center;
    box-shadow: 0 30px 100px rgba(0,0,0,.6);
    -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px);
    animation: modIn .4s var(--ease);
  }
  #login .box .drop { width: 52px; height: 52px; margin: 0 auto 14px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #7CEBFF, #38D9FF 45%, #0B5C7C); box-shadow: 0 0 22px rgba(56,217,255,.55); }
  #login .box h2 { font-size: 17px; margin-bottom: 4px; }
  #login .box p { color: var(--muted); font-size: 12.5px; margin-bottom: 18px; }
  #login input { margin-bottom: 12px; text-align: center; }
  #login .err { color: var(--err); font-size: 12.5px; min-height: 18px; margin-bottom: 6px; }

  /* ===== Misc ===== */
  .img-pick { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .img-thumb { width: 44px; height: 44px; border-radius: 8px; border: 1px solid rgba(124,235,255,.12); object-fit: contain; background: #fff; cursor: pointer; padding: 2px; }
  .img-thumb.on { outline: 2px solid var(--acc); }
  .backup-code { width: 100%; min-height: 130px; background: #080D16; border: 1px dashed rgba(124,235,255,.22); color: #9FE4FF; border-radius: 10px; padding: 12px; font-family: Consolas, monospace; font-size: 12px; }
  .kbd { background: var(--panel2); border: 1px solid rgba(124,235,255,.12); border-radius: 6px; padding: 2px 8px; font-size: 11px; color: var(--soft); }

  /* ===== Dashboard stats ===== */
  .statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .statcard {
    background: linear-gradient(145deg, rgba(13,20,33,.96), rgba(9,14,24,.96));
    border: 1px solid rgba(124,235,255,.10); border-radius: 14px; padding: 16px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.035), 0 14px 40px rgba(0,0,0,.25);
  }
  .statcard.warn { border-color: rgba(255,200,87,.35); }
  .statnum { font-size: 30px; font-weight: 700; color: var(--acc); line-height: 1.05; font-variant-numeric: tabular-nums; }
  .statcard.warn .statnum { color: var(--warn); }
  .statlabel { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-top: 6px; font-weight: 700; }
  .statnote { font-size: 11px; color: var(--muted); margin-top: 3px; opacity: .8; }
  @media (max-width: 760px) { .statgrid { grid-template-columns: 1fr 1fr; } }

  /* ===== Business panel (inventory / sales) ===== */
  .kpi { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .kpi-card {
    position: relative;
    background: linear-gradient(145deg, rgba(13,20,33,.96), rgba(9,14,24,.96));
    border: 1px solid rgba(124,235,255,.10); border-radius: 16px; padding: 16px 18px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.035), 0 18px 50px rgba(0,0,0,.28);
    transition: transform .3s var(--ease), border-color .3s ease, box-shadow .3s ease;
  }
  .kpi-card:hover {
    transform: translateY(-2px);
    border-color: rgba(124,235,255,.22);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.035), 0 20px 55px rgba(0,0,0,.32), 0 0 26px rgba(56,217,255,.06);
  }
  .kpi-card .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
  .kpi-card .v { font-size: 26px; font-weight: 650; color: var(--text); margin-top: 6px; line-height: 1.1; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .kpi-card .n { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  .kpi-card.green .v { color: var(--ok); } .kpi-card.red .v { color: var(--err); } .kpi-card.yellow .v { color: var(--warn); }
  .kpi-card.small .v { font-size: 20px; }
  .kpi-card .sparkline { position: absolute; bottom: 12px; right: 16px; opacity: .5; }
  .periods { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .period-card { background: linear-gradient(145deg, rgba(13,20,33,.6), rgba(9,14,24,.6)); border: 1px solid rgba(124,235,255,.08); border-radius: 14px; padding: 15px 17px; }
  .period-card h4 { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--accb); margin-bottom: 9px; }
  .period-card .row { justify-content: space-between; font-size: 12.5px; padding: 3px 0; }
  .period-card .row span { color: var(--muted); }
  .period-card .row b { color: var(--text); font-weight: 600; }
  .htable-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid rgba(255,255,255,.055); }
  .htable { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 640px; font-variant-numeric: tabular-nums; }
  .htable th { text-align: left; color: var(--muted); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; padding: 9px 10px; border-bottom: 1px solid rgba(255,255,255,.07); background: #0A101B; white-space: nowrap; }
  .htable td { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,.045); vertical-align: middle; background: #0D1421; }
  .htable tbody tr { transition: background .2s ease; }
  .htable tbody tr:hover td { background: #111A29; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .badge.ok { background: var(--oksoft); color: var(--ok); border: 1px solid rgba(53,224,161,.18); }
  .badge.warn { background: var(--warnsoft); color: var(--warn); border: 1px solid rgba(255,200,87,.18); }
  .badge.err { background: var(--errsoft); color: var(--err); border: 1px solid rgba(255,92,122,.18); }
  .badge.gray { background: rgba(94,107,125,.12); color: var(--muted); border: 1px solid rgba(94,107,125,.18); }
  .badge.blu { background: var(--accsoft); color: var(--acc); border: 1px solid rgba(56,217,255,.18); }
  .alert-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 14px; border-radius: 11px; margin-bottom: 8px; border: 1px solid var(--line); cursor: pointer; transition: background .25s ease, border-color .25s ease; }
  .alert-item.warn { background: rgba(255,200,87,.06); border-color: rgba(255,200,87,.28); }
  .alert-item.err { background: rgba(255,92,122,.06); border-color: rgba(255,92,122,.32); }
  .alert-item:hover { border-color: var(--line2); }
  .quick { display: flex; flex-wrap: wrap; gap: 9px; }
  .quick .btn { display: inline-flex; align-items: center; gap: 7px; }
  .chart-box { position: relative; height: 220px; }
  .chart-box.tall { height: 265px; }
  .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .sortbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .sortbar .btn.small.on { background: linear-gradient(135deg, #7CEBFF, #38D9FF); color: #041018; border-color: transparent; }
  .searchin { max-width: 280px; }
  .detail-dl { display: grid; grid-template-columns: 150px 1fr; gap: 7px 14px; font-size: 13px; }
  .detail-dl dt { color: var(--muted); }
  .detail-dl dd { color: var(--text); font-weight: 600; word-break: break-word; }
  .money-cell { text-align: right; white-space: nowrap; }
  .custlink { background: none; border: 0; padding: 0; color: var(--acc); font-size: 12.5px; font-weight: 650; font-family: inherit; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
  .custlink:hover { color: var(--text); text-decoration: underline; }
  .muted { color: var(--muted); }
  .modal-back { position: fixed; inset: 0; background: rgba(2,8,16,.72); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 80; padding: 18px; animation: modBack .25s ease; }
  .modal { width: 560px; max-width: 100%; max-height: 88vh; overflow: auto; background: rgba(13,20,33,.94); border: 1px solid rgba(124,235,255,.13); border-radius: 16px; padding: 22px; box-shadow: 0 30px 100px rgba(0,0,0,.6); -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px); animation: modIn .3s var(--ease); }
  @keyframes modIn { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
  @keyframes modBack { from { opacity: 0; } to { opacity: 1; } }
  .modal h3 { font-size: 15px; margin-bottom: 14px; text-transform: uppercase; letter-spacing: .05em; color: var(--accb); }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
  .modal-close { position: absolute; top: 12px; right: 14px; background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; }
  .modal-wrap { position: relative; }
  .preserve-num { font-variant-numeric: tabular-nums; }
/* ===== Business Intelligence ===== */
  .bi-panel {
    position: relative;
    border-radius: 18px;
    padding: 18px 20px;
    margin-bottom: 18px;
    background: linear-gradient(145deg, rgba(13,20,33,.94), rgba(15,12,30,.94));
    border: 1px solid rgba(124,235,255,.10);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.035), 0 18px 50px rgba(0,0,0,.28);
    overflow: hidden;
    cursor: pointer;
    transition: transform .3s var(--ease), border-color .3s ease;
  }
  .bi-panel::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(320px 140px at 92% 0%, rgba(56,217,255,.12), transparent 70%),
      radial-gradient(260px 120px at 0% 100%, rgba(139,124,255,.10), transparent 70%);
    opacity: .8;
  }
  .bi-head { position: relative; display: flex; align-items: center; gap: 9px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accb); font-weight: 700; margin-bottom: 10px; }
  .bi-head .spark { font-size: 13px; color: var(--purple); }
  .bi-text { position: relative; font-size: 14px; line-height: 1.7; color: var(--soft); }
  .bi-text b { color: var(--text); font-weight: 650; }
  .bi-tags { position: relative; display: flex; gap: 8px; margin-top: 13px; flex-wrap: wrap; }
  .bi-tag { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; border: 1px solid rgba(124,235,255,.14); background: rgba(56,217,255,.06); color: var(--accb); }

<script>
(function () {
  "use strict";
  var DEFAULTS = null;
  var DATA = null;          /* working copy */
  var dirty = false;
  var fileHandle = null;
  var DRAFT_KEY = 'rwDraft';
  var memStore = {};

  /* ---- safe storage (never throws, falls back to memory) ---- */
  function ssGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return k in memStore ? memStore[k] : null; } }
  function ssSet(k, v) { memStore[k] = v; try { sessionStorage.setItem(k, v); } catch (e) {} }
  function ssDel(k) { delete memStore[k]; try { sessionStorage.removeItem(k); } catch (e) {} }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return k in memStore ? memStore[k] : null; } }
  function lsSet(k, v) { memStore[k] = v; try { localStorage.setItem(k, v); } catch (e) {} }

  /* ---- notifications ---- */
  var notifBell = document.getElementById('notifBell');
  var notifBadge = document.getElementById('notifBadge');
  var notifDropdown = document.getElementById('notifDropdown');
  var notifList = document.getElementById('notifList');
  var notifMarkRead = document.getElementById('notifMarkRead');
  var notifWrap = document.getElementById('notifWrap');
  var lastNotifCount = 0;
  var notifAudio = null;

  function timeAgo(ts) {
    var diff = Date.now() - ts;
    if (diff < 60000) return 'Just now';
    if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
    if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
    return Math.floor(diff / 86400000) + 'd ago';
  }

  function renderNotifs(list) {
    if (!list || !list.length) { notifList.innerHTML = '<div class="notif-empty">No notifications yet</div>'; return; }
    notifList.innerHTML = '<div class="notif-actions"><button class="notif-clear-all" id="notifClearAll" type="button">Clear All</button></div>' + list.slice(0, 50).map(function (n) {
      var replyBtn = n.orderId ? '<button class="notif-reply-btn" data-nid="' + n.id + '" data-phone="' + (n.phone || '') + '" type="button">Reply</button>' : '';
      return '<div class="notif-item' + (n.read ? '' : ' unread') + '" data-nid="' + n.id + '" data-order="' + (n.orderId || '') + '">' +
        '<div class="notif-item-top"><div class="notif-item-title">' + (n.title || 'Notification') + replyBtn + '</div>' +
        '<button class="notif-delete-btn" data-nid="' + n.id + '" type="button" title="Delete">&times;</button></div>' +
        '<div class="notif-item-body">' + (n.body || '') + '</div>' +
        '<div class="notif-reply-box" id="replyBox-' + n.id + '" style="display:none">' +
          '<input type="text" class="notif-reply-input" id="replyInput-' + n.id + '" placeholder="Type reply message...">' +
          '<button class="notif-reply-send" data-nid="' + n.id + '" data-phone="' + (n.phone || '') + '" type="button">Send</button>' +
        '</div>' +
        '<div class="notif-item-time">' + timeAgo(n.at) + '</div>' +
        '</div>';
    }).join('');
    /* Bind delete buttons */
    notifList.querySelectorAll('.notif-delete-btn').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var nid = btn.getAttribute('data-nid');
        fetch('/api/notifications/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-admin-token': lsGet('rw_admin_tok') || '' },
          body: JSON.stringify({ id: nid })
        }).then(function () { fetchNotifs(); }).catch(function () {});
      });
    });
    /* Bind Clear All */
    var clearAll = notifList.querySelector('#notifClearAll');
    if (clearAll) clearAll.addEventListener('click', function () {
      fetch('/api/notifications/read', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-token': lsGet('rw_admin_tok') || '' }, body: JSON.stringify({ readAll: true, deleteAll: true }) })
        .then(function () { fetchNotifs(); }).catch(function () {});
    });
  }

  function playNotifSound() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var now = ctx.currentTime;
      function beep(start, freq, dur, vol) {
        var o = ctx.createOscillator();
        var g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sine';
        o.frequency.setValueAtTime(freq, now + start);
        g.gain.setValueAtTime(vol, now + start);
        g.gain.exponentialRampToValueAtTime(0.01, now + start + dur);
        o.start(now + start);
        o.stop(now + start + dur);
      }
      beep(0, 880, 0.15, 0.5);
      beep(0.18, 1100, 0.15, 0.5);
      beep(0.36, 1320, 0.2, 0.5);
      beep(0.6, 1100, 0.15, 0.4);
      beep(0.78, 880, 0.25, 0.4);
    } catch (e) {}
  }

  /* ---------- helpers ---------- */
  function adminAuthHeaders() {
    return { 'Content-Type': 'application/json', 'x-admin-token': lsGet('rw_admin_tok') || '' };
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function field(label, key, opts) {
    opts = opts || {};
    var val = resolve(DATA, key);
    var ph = opts.placeholder ? ' placeholder="' + esc(opts.placeholder) + '"' : '';
    var rows = opts.rows ? ' rows="' + opts.rows + '"' : '';
    var inp = opts.area
      ? '<textarea class="full" data-k="' + key + '"' + rows + ph + '>' + esc(val) + '</textarea>'
      : opts.num
        ? '<input type="number" data-k="' + key + '" value="' + esc(val) + '">'
        : '<input type="text" data-k="' + key + '" value="' + esc(val) + '"' + ph + '>';
    return '<div class="field' + (opts.full ? ' full' : '') + '"><label>' + label + (opts.req ? ' <b>*</b>' : '') + '</label>' + inp + (opts.hint ? '<div class="hint">' + opts.hint + '</div>' : '') + '</div>';
  }
  function resolve(o, key) {
    var p = key.split('.');
    for (var i = 0; i < p.length; i++) { if (o == null) return undefined; o = o[p[i]]; }
    return o;
  }
  function stageImagesField() {

        '<input type="file" accept="image/*" data-file="hero.stageImg.' + i + '">' +

        '</div>';

  function setAt(o, key, val) {
    var p = key.split('.');
    for (var i = 0; i < p.length - 1; i++) { if (o[p[i]] == null) o[p[i]] = {}; o = o[p[i]]; }
    o[p[p.length - 1]] = val;
  }

  function bindForm(root) {
    if (!root) return;
    root.querySelectorAll('[data-k]').forEach(function (el) {
      el.addEventListener('input', function () {
        var key = el.getAttribute('data-k');
        var val;
        if (el.type === 'number' || el.tagName === 'SELECT') {
          val = el.type === 'number' ? (el.value === '' ? 0 : Number(el.value)) : resolve(DATA, key.replace(/\.(category|name|img|badge|size|label)$/, ''));
        } else {
          val = el.value;
        }
        if (el.tagName === 'SELECT') {
          var p = key.split('.');
          var obj = resolve(DATA, p.slice(0, p.length - 1).join('.'));
          obj[p[p.length - 1]] = el.value;
        } else {
          setAt(DATA, key, val);
        }
        setDirty(true);
      });
    });
    root.querySelectorAll('input[data-chex]').forEach(function (el) {
      el.addEventListener('change', function () {
        setAt(DATA, el.getAttribute('data-chex'), el.checked);
        setDirty(true);
      });
    });
    root.querySelectorAll('input[data-file]').forEach(function (el) {
      el.addEventListener('change', function () {
        var file = el.files && el.files[0];
        if (!file) return;
        var key = el.getAttribute('data-file');
        _uploadInProgress = true;
        toast('Removing background...');
        var img = new Image();
        var url = URL.createObjectURL(file);
        img.onload = function () {
          URL.revokeObjectURL(url);
          var maxW = 800, maxH = 800, w = img.width, h = img.height;
          if (w > maxW || h > maxH) {
            var ratio = Math.min(maxW / w, maxH / h);
            w = Math.round(w * ratio);
            h = Math.round(h * ratio);
          }
          var cv = document.createElement('canvas');
          cv.width = w; cv.height = h;
          cv.getContext('2d').drawImage(img, 0, 0, w, h);
          var rawDataUrl = cv.toDataURL('image/webp', 0.82);

          function uploadImage(dataUrlToUpload) {
            toast('Uploading image...');
            fetch('/api/upload', {
              method: 'POST',
              headers: adminAuthHeaders(),
              body: JSON.stringify({ dataUrl: dataUrlToUpload })
            }).then(function (r) { return r.json(); }).then(function (res) {
              if (res && res.ok && res.dataUrl) {
                setAt(DATA, key, res.dataUrl);
                setDirty(true);
                render();
                _uploadInProgress = false;
                scheduleAutoSave();
                toast('Image updated!');
              } else {
                _uploadInProgress = false;
                toast('Upload failed: ' + (res && res.error || 'unknown'), true);
              }
            }).catch(function (e) {
              console.warn('[upload] error:', e);
              setAt(DATA, key, dataUrlToUpload);
              setDirty(true);
              render();
              _uploadInProgress = false;
              toast('Upload failed — saved locally');
            });
          }

          if (typeof removeBackgroundFromImage === 'function') {
            removeBackgroundFromImage(rawDataUrl).then(function (processedDataUrl) {
              uploadImage(processedDataUrl);
            }).catch(function (err) {
              console.warn('[bgremove] failed, uploading original:', err);
              uploadImage(rawDataUrl);
            });
          } else if (window.imgly && typeof window.imgly.removeBackground === 'function') {
            window.imgly.removeBackground(rawDataUrl).then(function (processedDataUrl) {
              uploadImage(processedDataUrl);
            }).catch(function (err) {
              console.warn('[bgremove] failed, uploading original:', err);
              uploadImage(rawDataUrl);
            });
          } else {
            toast('Background removal not ready — uploading original...');
            uploadImage(rawDataUrl);
          }
        };
        img.onerror = function () { URL.revokeObjectURL(url); _uploadInProgress = false; toast('Failed to process image', true); };
        img.src = url;
      });
    });
    root.querySelectorAll('button[data-clear]').forEach(function (el) {
      el.addEventListener('click', function () {
        setAt(DATA, el.getAttribute('data-clear'), '');
        setDirty(true);
        render();
      });
    });
  }

        window.BIZ.render(tab);

      }
      /* BIZ not loaded yet — try again shortly instead of falling back */
      setTimeout(function () { render(); }, 200);

  function afterRender(tab) {
    var el;
    if (tab === 'home' && (el = $('statReset'))) {
      el.onclick = function () { try { localStorage.removeItem('rw_stats'); } catch (e) {} render(); toast('Counters reset. \u2713'); };
    }
    if (tab === 'reviews') {
      if (window.fetch) {
        fetch('/api/reviews').then(function (res) { return res.ok ? res.json() : []; })
          .catch(function () { return []; })
          .then(function (list) {
            list = Array.isArray(list) ? list : [];
            var old = window.NEW_REVIEWS || null;
            if (!old || JSON.stringify(list.map(function (x) { return x.id; })) !== JSON.stringify(old.map(function (x) { return x.id; }))) {
              window.NEW_REVIEWS = list;
              render();
            }
          });
      }
      if (!window.NEW_REVIEWS) {
        var nr = [];
        try {
          var raw = lsGet('rw_user_reviews');
          if (raw) nr = JSON.parse(raw);
          if (!Array.isArray(nr)) nr = [];
        } catch (e) { nr = []; }
        window.NEW_REVIEWS = nr;
      }
      $('content').querySelectorAll('button[data-act]').forEach(function (b) {
        b.addEventListener('click', function () {
          var act = b.getAttribute('data-act'), i = Number(b.getAttribute('data-i'));
          if (act === 'keep' || act === 'rmrev') {
            var nrList = window.NEW_REVIEWS || [];
            if (i < 0 || i >= nrList.length) return;
            if (act === 'keep') {
              var r = nrList[i];
              var exists = DATA.reviews.carousel.some(function (x) { return x.name === r.name && x.text === r.text; });
              if (!exists) {
                DATA.reviews.carousel.push({ name: r.name, rating: r.rating, text: r.text, meta: (r.product || 'Website review') + ' · ' + (r.date || 'New') });
                setDirty(true);
              }
            }
            if (window.fetch && nrList[i] && nrList[i].id) {
              fetch('/api/reviews/delete', {
                method: 'POST',
                headers: adminAuthHeaders(),
                body: JSON.stringify({ id: nrList[i].id })
              }).catch(function () {});
            }
            nrList.splice(i, 1);
            window.NEW_REVIEWS = nrList;
          } else if (act === 'rmgrid') {
            if (i < 0 || i >= DATA.reviews.grid.length) return;
            DATA.reviews.grid.splice(i, 1); setDirty(true);
          } else if (act === 'rmcar') {
            if (i < 0 || i >= DATA.reviews.carousel.length) return;
            DATA.reviews.carousel.splice(i, 1); setDirty(true);
          } else {
            return;
          }
          render();
          toast(act === 'keep' ? 'Review kept — added to the rotating circle. ✓' : 'Review deleted.');
        });
      });
      $('content').querySelectorAll('.reply-toggle-btn').forEach(function (b) {
        b.addEventListener('click', function () {
          var source = b.getAttribute('data-source');
          var idx = Number(b.getAttribute('data-idx'));
          var box = document.getElementById('replyBox-' + source + '-' + idx);
          if (box) { box.style.display = box.style.display === 'none' ? 'block' : 'none'; }
        });
      });
      $('content').querySelectorAll('.notif-reply-send[data-source]').forEach(function (b) {
        if (!b.closest('#content .card h3') && !b.hasAttribute('data-nid')) {
          b.addEventListener('click', function () {
            var source = b.getAttribute('data-source');
            var idx = Number(b.getAttribute('data-idx'));
            var input = document.getElementById('replyInput-' + source + '-' + idx);
            if (!input) return;
            var text = input.value.trim();
            if (!text) return;
            var arr = source === 'grid' ? DATA.reviews.grid : DATA.reviews.carousel;
            if (idx >= 0 && idx < arr.length) {
              arr[idx].reply = text;
              setDirty(true);
              render();
              toast('Reply saved! Website par dikhega. ✓');
            }
          });
        }
      });
    }
    if (tab === 'brand' && (el = $('logoClear'))) {
      el.onclick = function () { setAt(DATA, 'brand.logoImage', ''); setDirty(true); render(); };
    }
    if (tab === 'products') {
      (el = $('prodAdd')).onclick = function () {
        DATA.products.push({ id: 'p' + String(Date.now()).slice(-6), name: 'New Product', label: 'New Product 1 LITRE', size: '1 LITRE', category: 'Premium Water', price: 20, boxSize: 12, minBoxes: 1, maxQty: 40, img: '../images/bisleri.webp', badge: '', featured: false });
        setDirty(true);
        render();
      };
      $('content').querySelectorAll('button[data-act]').forEach(function (b) {
        b.addEventListener('click', function () {
          var act = b.getAttribute('data-act'), i = Number(b.getAttribute('data-i'));
          if (act === 'rm') { DATA.products.splice(i, 1); }
          else if (act === 'up' && i > 0) { var t = DATA.products[i - 1]; DATA.products[i - 1] = DATA.products[i]; DATA.products[i] = t; }
          else if (act === 'down' && i < DATA.products.length - 1) { var t2 = DATA.products[i + 1]; DATA.products[i + 1] = DATA.products[i]; DATA.products[i] = t2; }
          else return;
          setDirty(true);
          render();
        });
      });
    }
    if (tab === 'settings') {
      (el = $('expBtn')).onclick = doExport;
      (el = $('impBtn')).onclick = doImport;
      (el = $('resetBtn')).onclick = function () {
        if (!confirm('Reset ALL content back to the original Rajesh Water texts, products, reviews?')) return;
        DATA = clone(loadDefaults());
        setDirty(true);
        render();
      };
      (el = $('pwChangeBtn')).onclick = function () {
        var oldPw = ($('pwOld').value || '').trim();
        var newPw = ($('pwNew').value || '').trim();
        var confirmPw = ($('pwConfirm').value || '').trim();
        var statusEl = $('pwChangeStatus');
        var stored = lsGet('rw_admin_pw') || 'admin123';
        if (oldPw !== stored) { statusEl.innerHTML = '<span style="color:#f87171">Current passcode is wrong!</span>'; return; }
        if (!newPw || newPw.length < 4) { statusEl.innerHTML = '<span style="color:#f87171">New passcode must be at least 4 characters!</span>'; return; }
        if (newPw !== confirmPw) { statusEl.innerHTML = '<span style="color:#f87171">New passcodes do not match!</span>'; return; }
        lsSet('rw_admin_pw', newPw);
        $('pwOld').value = ''; $('pwNew').value = ''; $('pwConfirm').value = '';
        statusEl.innerHTML = '<span style="color:#4ade80">Passcode changed successfully! &#10003;</span>';
      };
      /* wa-bot status check */
      var waBotDot = $('waBotDot'), waBotLabel = $('waBotLabel'), waBotDetail = $('waBotDetail');
      if (waBotDot) {
        fetch('/api/orders/config').then(function(r){return r.json()}).then(function(d){
          if (d && d.ok) {
            var configured = d.whatsappConfigured;
            waBotDot.style.background = configured ? '#4ade80' : '#f87171';
            waBotLabel.textContent = configured ? 'WhatsApp Connected' : 'WhatsApp Not Connected';
            waBotDetail.textContent = configured ? 'Orders will be sent to owner WhatsApp automatically.' : 'Open QR Scanner to connect WhatsApp. Scan QR code with owner phone.';
          }
        }).catch(function(){
          waBotDot.style.background = '#fbbf24';
          waBotLabel.textContent = 'Cannot check status';
          waBotDetail.textContent = 'Server reachable nahi hai.';
        });
      }
      (el = $('waOwner')) && fetch('/api/orders/config').then(function(r){return r.json()}).then(function(d){
        /* owner number is from site-data, just show current */
      }).catch(function(){});
      (el = $('waSaveBtn')).onclick = function () {
        var owner = ($('waOwner').value || '').trim();
        if (!owner) { $('waStatus').innerHTML = '<span style="color:#f87171">Owner number required!</span>'; return; }
        /* Save owner number to site-data via existing API */
        fetch('/api/site-data').then(function(r){return r.json()}).then(function(d){
          if (d && d.ok && d.content) {
            var sd = d.content;
            if (sd.contact) { sd.contact.whatsapp = owner; sd.contact.phone = owner; }
            return fetch('/api/site-data', { method: 'POST', headers: adminAuthHeaders(), body: JSON.stringify(sd) });
          }
        }).then(function(r){return r&&r.json?r.json():null}).then(function(d){
          if (d && d.ok) { $('waStatus').innerHTML = '<span style="color:#4ade80">Owner number saved! &#10003;</span>'; }
          else { $('waStatus').innerHTML = '<span style="color:#f87171">Save failed.</span>'; }
        }).catch(function(e){ $('waStatus').innerHTML = '<span style="color:#f87171">Error: '+e.message+'</span>'; });
      };
    }
  }

  /* ---------- serialize / save ---------- */
  function serialize() {
    return '/* ============================================================\n' +
      '   Rajesh Water - site-data.js  (generated by admin.html)\n   SINGLE SOURCE OF TRUTH\n   ============================================================ */\n\n' +
      'window.SITE_DATA = ' + JSON.stringify(DATA, null, 2) + ';\n';
  }
  function toast(msg, isErr) {
    var t = $('toast');
    t.textContent = msg;
    t.className = 'show' + (isErr ? ' err' : '');
    clearTimeout(window.__toastT);
    window.__toastT = setTimeout(function () { t.className = ''; }, 4200);
  }
  async function save() {
    var src = serialize();
    $('saveBtn').disabled = true;
    $('saveBtn').textContent = 'Saving\u2026';
    try {
      var apiOk = false;
      try {
        var resp = await fetch('/api/site-data', {
          method: 'POST',
          headers: adminAuthHeaders(),
          body: JSON.stringify(DATA)
        });
        var res = await resp.json();
        console.log('[admin-save] POST /api/site-data →', resp.status, res);
        if (res && res.ok) apiOk = true;
      } catch (e) { /* API unavailable — continue with local save */ }

      if (fileHandle && await fileHandle.queryPermission({ mode: 'readwrite' }) !== 'granted') {
        await fileHandle.requestPermission({ mode: 'readwrite' });
      }
      var handle = fileHandle;
      try {
        var savedToDisk = false;
        if (typeof showSaveFilePicker === 'function') {
          handle = handle || await showSaveFilePicker({
            suggestedName: 'site-data.js',
            types: [{ description: 'JavaScript', accept: { 'application/javascript': ['.js'] } }]
          });
          var w = await handle.createWritable();
          await w.write(src);
          await w.close();
          savedToDisk = true;
          try { localStorage.setItem('rwFileHandle', JSON.stringify(handle)); fileHandle = handle; } catch (e) {}
        }
        if (!savedToDisk && !apiOk) { fallbackDownload(); return; }
        DEFAULTS = clone(DATA);
        setDirty(false);
        clearDraft();
        toast(apiOk ? 'Saved \u2014 website updated live! \u2714' : 'Saved to file \u2014 deploy to update website. \u2714');
        if (apiOk) {
          toast('Saved \u2014 pushing to Vercel...');
          fetch('/api/deploy', { method: 'POST', headers: adminAuthHeaders() })
            .then(function (r) { return r.json(); })
            .then(function (d) {
              console.log('[admin-save] deploy result:', d);
              if (d && d.ok) toast('Saved \u2014 deployed to Vercel! \u2714');
              else toast('Saved locally \u2014 deploy failed: ' + (d && d.error || 'unknown'), true);
            })
            .catch(function (e) { console.warn('[admin-save] deploy error:', e); toast('Saved locally \u2014 deploy error', true); });
        }
      } catch (e) {
        if (e && e.name === 'AbortError') { toast('Save cancelled.', true); }
        else if (!apiOk) { fallbackDownload(); }
        else { DEFAULTS = clone(DATA); setDirty(false); clearDraft(); toast('Saved to server \u2014 website updated! \u2714');
          fetch('/api/deploy', { method: 'POST', headers: adminAuthHeaders() })
            .then(function (r) { return r.json(); })
            .then(function (d) { console.log('[admin-save] deploy result:', d); if (d && d.ok) toast('Deployed to Vercel! \u2714'); })
            .catch(function (e) { console.warn('[admin-save] deploy error:', e); });
        }
      }
    } catch (e) {
      fallbackDownload();
    } finally {
      $('saveBtn').disabled = dirty;
      $('saveBtn').textContent = 'Save Changes';
    }
  }
  function fallbackDownload() {
    var blob = new Blob([serialize()], { type: 'application/javascript' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'site-data.js';
    a.click();
    DEFAULTS = clone(DATA);
    setDirty(false);
    clearDraft();
    toast('Downloaded site-data.js — put this file in the data/ folder (replace the old one), then refresh the site.');
  }
  function doExport() {
    var blob = new Blob([serialize()], { type: 'application/javascript' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'site-data-backup.js';
    a.click();
    toast('Backup file downloaded. ✓');
  }
  function doImport() {
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = '.js';
    inp.onchange = function () {
      var f = inp.files && inp.files[0];
      if (!f) return;
      var rd = new FileReader();
      rd.onload = function () {
        try {
          var m = rd.result.match(/window\.SITE_DATA\s*=\s*([\s\S]*?);\s*$/);
          if (!m) throw new Error('bad format');
          var parsed = JSON.parse(m[1]);
          if (!parsed || !parsed.brand) throw new Error('not a site-data file');
          DATA = parsed;
          setDirty(true);
          render();
          toast('Imported ' + f.name + '. Press Save to write it to disk. ✓');
        } catch (e) {
          toast('That file does not look like a site-data.js file.', true);
        }
      };
      rd.readAsText(f);
    };
    inp.click();
  }

  /* ---------- wiring ---------- */
  var navStacked = false;
  function openNav() {
    var w = $('app');
    if (!w || w.classList.contains('nav-open')) return;
    w.classList.add('nav-open');
    if (!navStacked) { try { history.pushState({ rwNav: 1 }, ''); } catch (e) {} navStacked = true; }
  }
  function closeNav() {
    var w = $('app');
    if (!w) return;
    if (w.classList.contains('nav-open')) {
      w.classList.remove('nav-open');
      if (navStacked) { try { history.back(); } catch (e) {} navStacked = false; }
    }
  }
  window.addEventListener('popstate', function () {
    var w = $('app');
    if (w && w.classList.contains('nav-open')) { w.classList.remove('nav-open'); navStacked = false; }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeNav(); });
  $('menuBtn').addEventListener('click', function () {
    if ($('app').classList.contains('nav-open')) closeNav(); else openNav();
  });
  $('sideBack').addEventListener('click', closeNav);
  $('sideClose').addEventListener('click', closeNav);
  var osLink = document.querySelector('.open-site');
  if (osLink) osLink.addEventListener('click', function () { closeNav(); });
  /* drawer open => tap anywhere OUTSIDE the drawer closes it; inside taps never close */
  document.addEventListener('click', function (e) {
    var w = $('app');
    if (!w || !w.classList.contains('nav-open')) return;
    var t = e.target;
    if (!t || !t.closest) return;
    if (t.closest('.side') || t.closest('#sideBack') || t.closest('#menuBtn')) return;
    closeNav();
  });
  $('nav').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]');
    if (!b) return;
    ssSet('rwTab', b.getAttribute('data-tab'));
    $('nav').querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
    render();
    closeNav();
  });
  var brandEl = document.querySelector('.side .brand');
  if (brandEl) brandEl.addEventListener('click', function () {
    ssSet('rwTab', 'biz-dash');
    $('nav').querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x.getAttribute('data-tab') === 'biz-dash'); });
    render();
    closeNav();
  });
  $('saveBtn').addEventListener('click', save);
  $('revertBtn').addEventListener('click', function () {
    DATA = clone(loadDefaults());
    setDirty(false);
    clearDraft();
    render();
    toast('Reverted to last saved state.');
  });
  window.addEventListener('beforeunload', function () {
    if (dirty) backupDraft();
  });

  window.addEventListener('DOMContentLoaded', function () {
    var raw = lsGet('rwFileHandle');
    if (raw) { try { fileHandle = JSON.parse(raw); } catch (e) {} }
    ssSet('rwTab', 'biz-dash');
    if (ssGet('rwAdminOk') === '1') render();
  });

  /* ---------- fatal-error guard: never leave a dead panel ---------- */
  window.addEventListener('error', function (ev) {
    try {
      var t = document.getElementById('toast');
      if (t) { t.textContent = 'Panel error: ' + (ev.message || 'unknown'); t.className = 'show err';
        clearTimeout(window.__toastT);
        window.__toastT = setTimeout(function () { t.className = ''; }, 6000); }
    } catch (e) {}
  });

  /* expose small API for the business module (js/admin-biz.js) */
  window.RW = {
    toast: toast, esc: esc, $: $, render: render, setDirty: setDirty,
    bizSeed: function () { return clone(loadDefaults()); },
    goto: function (t) {
      ssSet('rwTab', t);
      $('nav').querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x.getAttribute('data-tab') === t); });
      render();
      closeNav();
    }
  };
})();
</script>

<div class="cmd-back" id="cmdBack" role="dialog" aria-modal="true" aria-label="Command palette">
  <div class="cmd">
    <input type="text" id="cmdInp" placeholder="Search customer, command &hellip;" autocomplete="off">
    <div class="cmd-kind"><label>Search customers:</label>
      <select id="cmdKind">
        <option value="all">Sell + Purchase</option>
        <option value="sell">Sell only</option>
        <option value="purchase">Purchase only</option>
      </select>
    </div>
    <div class="cmd-list" id="cmdList"></div>
    <div class="cmd-foot"><span><b>&uarr;&darr;</b> navigate</span><span><b>Enter</b> open</span><span><b>Esc</b> close</span></div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var CMDS = [
    { t: 'Dashboard', d: 'Business overview, KPIs and charts', tab: 'biz-dash' },
    { t: "Show today's sales", d: 'Today sales, cash and online split', tab: 'biz-today' },
    { t: 'Show this month\u2019s profit', d: 'Profit & reports section', tab: 'biz-reports' },
    { t: 'Show low stock alerts', d: 'Products below minimum stock', tab: 'biz-alerts' },
    { t: 'Open cash sales', d: 'Record a cash sale instantly', tab: 'biz-cash' },
    { t: 'Find product stock', d: 'Search inventory by product', tab: 'biz-inventory' },
    { t: 'Add stock', d: 'Purchase / stock-in entry', tab: 'biz-stock' },
    { t: 'Online orders', d: 'Pending orders from the website', tab: 'biz-orders' },
    { t: 'Sales history', d: 'All recorded sales', tab: 'biz-sales' },
    { t: 'Purchases', d: 'All stock-in transactions', tab: 'biz-purchases' },
    { t: 'Products master', d: 'Edit products, cost, price, min stock', tab: 'biz-products' },
    { t: 'Customers', d: 'Customer performance overview', tab: 'biz-customers' },
    { t: 'Business settings', d: 'Capital, min stock and business config', tab: 'biz-settings' },
    { t: 'Site stats', d: 'Website visitor statistics', tab: 'home' },
    { t: 'Homepage texts', d: 'Website homepage content', tab: 'homepage' },
    { t: 'Reviews', d: 'Website customer reviews', tab: 'reviews' },
    { t: 'Contact & WhatsApp', d: 'Phone, WhatsApp and address', tab: 'contact' },
    { t: 'Colors & motion', d: 'Website theme knobs', tab: 'theme' },
    { t: 'Settings & backup', d: 'Export / import site data', tab: 'settings' }
  ];
  var back = document.getElementById('cmdBack');
  var inp = document.getElementById('cmdInp');
  var list = document.getElementById('cmdList');
  var kindSel = document.getElementById('cmdKind');
  var items = [];
  var sel = 0;

  function open() {
    back.classList.add('open');
    items = CMDS;
    kindSel.value = 'all';
    sel = 0;
    inp.value = '';
    renderList();
    setTimeout(function () { inp.focus(); }, 30);
  }
  function close() {
    back.classList.remove('open');
  }
  function run(cmd) {
    close();
    if (cmd.kind === 'cust') {
      var B = window.BIZ;
      if (B && B.openCustomerDashboard) { B.openCustomerDashboard(cmd.name, cmd.kind2, cmd.date); return; }
    }
    if (window.RW && window.RW.goto) window.RW.goto(cmd.tab);
  }
  function buildShown() {
    var q = inp.value.trim().toLowerCase();
    var out = [];
    if (q) {
      var B = window.BIZ;
      var custs = (B && B.customerSearch) ? B.customerSearch(q, kindSel.value === 'all' ? '' : kindSel.value) : [];
      custs.forEach(function (c) {
        var pk = Object.keys(c.products || {});
        var prodTxt = pk.length ? ' \u00B7 ' + pk.map(function (k) { return c.products[k]; }).slice(0, 2).join(', ') + (pk.length > 2 ? '\u2026' : '') : '';
        out.push({ kind: 'cust', name: c.name, kind2: c.kind, date: c.date,
          t: c.name + ' \u00B7 ' + (c.kind === 'purchase' ? 'PURCHASE' : 'SELL'),
          d: c.date + prodTxt + ' \u00B7 ' + c.orders + ' order' + (c.orders === 1 ? '' : 's') + ' \u00B7 ' + c.boxes + ' box' + (c.boxes === 1 ? '' : 'es') + ' \u00B7 \u20B9' + (c.amount || 0).toLocaleString('en-IN') + (c.pending > 0 ? ' \u00B7 pending \u20B9' + c.pending.toLocaleString('en-IN') : '') + ' \u2192 open dashboard' });
      });
    }
    items.filter(function (c) { return !q || (c.t + ' ' + c.d).toLowerCase().indexOf(q) !== -1; }).forEach(function (c) { out.push(c); });
    return out;
  }
  function renderList() {
    var shown = buildShown();
    if (sel >= shown.length) sel = 0;
    if (!shown.length) {
      list.innerHTML = '<div class="cmd-empty">No match &mdash; try a customer name or &quot;low stock&quot;</div>';
      return;
    }
    list.innerHTML = '';
    shown.forEach(function (c, i) {
      var el = document.createElement('div');
      el.className = 'cmd-item' + (i === sel ? ' sel' : '');
      el.innerHTML = '<span>' + (c.kind === 'cust' ? '\uD83D\uDC64 ' : '') + c.t + '</span><span class="k">' + c.d + '</span>';
      el.addEventListener('click', function () { run(c); });
      el.addEventListener('mousemove', function () { sel = i; renderList(); });
      list.appendChild(el);
    });
  }
  document.getElementById('cmdBtn').addEventListener('click', open);
  kindSel.addEventListener('change', function () { sel = 0; renderList(); });
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); open(); return; }
    if (!back.classList.contains('open')) return;
    if (e.key === 'Escape') { close(); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); sel++; renderList(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); sel--; renderList(); }
    if (e.key === 'Enter') {
      e.preventDefault();
      var shown = buildShown();
      if (shown[sel]) run(shown[sel]);
    }
  });
  back.addEventListener('click', function (e) { if (e.target === back) close(); });
  inp.addEventListener('input', renderList);
  inp.addEventListener('keydown', function (e) { e.stopPropagation(); });

  /* ---- KPI count-up on dashboard renders ---- */
  window.rwBizAfterTab = function () {
    var cards = document.querySelectorAll('.kpi-card .v, .statnum');
    Array.prototype.forEach.call(cards, function (v) {
      if (v.getAttribute('data-cnt')) return;
      var text = v.textContent;
      var m = text.match(/([\d,]+(?:\.\d+)?)/);
      if (!m) return;
      var target = parseFloat(m[1].replace(/,/g, ''));
      if (!isFinite(target)) return;
      var prefix = text.slice(0, m.index);
      var suffix = text.slice(m.index + m[0].length);
      v.setAttribute('data-cnt', '1');
      var t0 = null;
      function step(ts) {
        if (!t0) t0 = ts;
        var p = Math.min(1, (ts - t0) / 700);
        p = 1 - Math.pow(1 - p, 3);
        v.textContent = prefix + Math.round(target * p).toLocaleString('en-IN') + suffix;
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  };
})();
</script>
